<!DOCTYPE html>
<html>
<head>
  <title>Moccasins Shop</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f9f9f9;
      color: #333;
    }

    header {
      text-align: center;
      padding: 40px 20px 20px 20px;
      background-color: #ffffff;
    }

    h1 {
        font-size: 3rem;
        margin: 0 0 20px 0;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: #2c3e50; 
    }

    hr {
      border: none;
      height: 3px;
      background-color: #2c3e50;
      width: 60%;
      margin: 0 auto;
      border-radius: 2px;
    }

    .products-list {
      display: flex;
      flex-direction: column;
      gap: 25px;
      padding: 40px 20px;
      max-width: 900px;
      margin: 0 auto;
    }

    .product card {
      display: flex;
      background-color: #ffffff;
      border-radius: 8px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .product-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
    }

    .product-image-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 25px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-grow: 1;
    }

    .product-title {
        font-size: 1.4rem;
        font-weight: 600;
        color: #2c3e50;
        margin: 0 0 10px 0;
    }

    .product-description {
      font-size: 1rem;
      color: #666;
      line-height: 1.5;
      margin: 0 0 15px 0;
    }

    .product-price {
      font-size: 1.5rem;
      color: #e74c3c;
      font-weight: bold;
      margin: 0;
    }

    @media (max-width: 650px) {
        .product-card {
            flex-direction: column;
        }
        .product-image-container {
            width: 100%;
            min-width: 100%;
            height: 250px;
        }
        .product-info {
              padding: 20px;
        }
    }
  </style>
</head>
<body>
  <header>
    <h1>Moccasins Shop</h1>
    <hr>
  </header>
  <main>
    <div class="product-list">
      <div class="product-card">
          <div class="product-image-container">
              <img src="pic/1.jpg" alt="Кожаные мокасины">
          </div>
          <div class="product-info">
              <div>
                  <h2 class="product-title">Замшевые повседневные мокасины</h2>
                  <p class="product-description">Классические мягкие мокасины из натуральной замши со стильным кожаным шнурком. Гибкая шипованная подошва идеальна для долгих прогулок и вождения автомобиля.</p>
              </div>
              <div class="product-price">4 500 ₽</div>
          </div>
      </div>
    </div>
  </main>
</body>
</html>
